name: CI and security

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Official scanner images, pinned by manifest-list digest (no marketplace action, no installer).
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c

jobs:
  test:
    name: Test and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked runtime and verification dependencies
        run: python -m pip install --require-hashes --no-cache-dir -r requirements-dev.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -q

      - name: Lint
        run: ruff check app tests scripts

      - name: Type check
        run: mypy --explicit-package-bases app scripts

      - name: Audit Python dependencies
        run: |
          pip-audit --strict --require-hashes -r requirements.txt
          pip-audit --strict --require-hashes -r requirements-dev.txt

  image:
    name: Build and scan image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --pull --tag pebble-index-bridge:ci .

      - name: Export image for scanning
        run: |
          mkdir -p "$RUNNER_TEMP/image" "$RUNNER_TEMP/trivy-cache"
          docker save pebble-index-bridge:ci --output "$RUNNER_TEMP/image/image.tar"

      # Fails on any HIGH/CRITICAL in OS or Python packages, including vulnerabilities
      # with no upstream fix yet. The tarball is scanned, so the Docker socket is not mounted.
      - name: Scan image
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env TRIVY_CACHE_DIR=/cache \
            --env TRIVY_NO_PROGRESS=true \
            --volume "$RUNNER_TEMP/trivy-cache:/cache" \
            --volume "$RUNNER_TEMP/image:/scan:ro" \
            "$TRIVY_IMAGE" image \
              --input /scan/image.tar \
              --scanners vuln \
              --pkg-types os,library \
              --severity HIGH,CRITICAL \
              --ignore-unfixed=false \
              --exit-code 1 \
              --format table

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Allow documented placeholder examples
        run: |
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'EOF'
          [extend]
          useDefault = true

          [[allowlists]]
          description = "README curl examples use the deliberately invalid bearer placeholder."
          condition = "AND"
          paths = ['''(^|/)README\.md$''']
          regexTarget = "secret"
          regexes = ['''^deliberately-wrong$''']
          EOF

      # Offline (no network, read-only mount, no secrets) scan of the working tree and then of
      # every commit reachable from the checkout. Findings are redacted in the log.
      - name: Scan current tree
        run: |
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/gitleaks.toml:/gitleaks.toml:ro" \
            "$GITLEAKS_IMAGE" dir /repo \
              --config /gitleaks.toml --redact --no-banner --exit-code 1

      - name: Scan git history
        run: |
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/gitleaks.toml:/gitleaks.toml:ro" \
            "$GITLEAKS_IMAGE" git /repo \
              --config /gitleaks.toml --redact --no-banner --exit-code 1
