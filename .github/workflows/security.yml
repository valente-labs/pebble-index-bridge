name: CI and security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes --no-cache-dir -r requirements.txt

      - name: Install verification tools
        run: python -m pip install pytest==8.4.2 ruff==0.14.9 mypy==1.18.2 pip-audit==2.9.0

      - name: Run tests
        run: PYTHONPATH=. pytest -q

      - name: Lint
        run: ruff check app tests scripts

      - name: Type check
        run: mypy --explicit-package-bases app scripts

      - name: Audit Python dependencies
        run: pip-audit --strict --require-hashes -r requirements.txt

  image:
    name: Build and scan image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        run: docker build --pull --tag pebble-index-bridge:ci .

      - name: Scan image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: pebble-index-bridge:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Allow documented placeholder examples
        run: |
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'EOF'
          [extend]
          useDefault = true

          [allowlist]
          description = "The initial README uses deliberately invalid bearer placeholders in curl examples."
          regexTarget = "line"
          paths = ['''README\\.md$''']
          regexes = ['''Authorization: Bearer deliberately-wrong(?:-\\$i)?''']
          EOF

      - name: Scan repository
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ runner.temp }}/gitleaks.toml
