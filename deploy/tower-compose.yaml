services:
  index-bridge:
    image: ${INDEX_BRIDGE_IMAGE:?set INDEX_BRIDGE_IMAGE to an immutable image reference}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      BRIDGE_TOKEN_FILE: /run/secrets/bridge_token
      GROKBOT_WEBHOOK_URL_FILE: /run/secrets/grokbot_webhook_url
      GROKBOT_WEBHOOK_KEY_FILE: /run/secrets/grokbot_webhook_key
      DB_PATH: /data/index-bridge.sqlite3
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-15}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-65536}
      MAX_TRANSCRIPTION_CHARS: ${MAX_TRANSCRIPTION_CHARS:-8000}
      MAX_PENDING: ${MAX_PENDING:-1000}
      MAX_RECORDS: ${MAX_RECORDS:-10000}
      MAX_BYTES: ${MAX_BYTES:-33554432}
    secrets:
      - bridge_token
      - grokbot_webhook_url
      - grokbot_webhook_key
    volumes:
      - ${INDEX_BRIDGE_DATA_DIR:-/data}:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read(64)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      bridge:
        ipv4_address: ${INDEX_BRIDGE_ADDRESS:-172.16.242.2}

networks:
  bridge:
    driver: bridge
    ipam:
      config:
        - subnet: ${INDEX_BRIDGE_SUBNET:-172.16.242.0/29}

secrets:
  bridge_token:
    file: ${BRIDGE_TOKEN_FILE:?set BRIDGE_TOKEN_FILE to a local secret file}
  grokbot_webhook_url:
    file: ${GROKBOT_WEBHOOK_URL_FILE:?set GROKBOT_WEBHOOK_URL_FILE to a local secret file}
  grokbot_webhook_key:
    file: ${GROKBOT_WEBHOOK_KEY_FILE:?set GROKBOT_WEBHOOK_KEY_FILE to a local secret file}
